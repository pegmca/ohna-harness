services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiagent}
      POSTGRES_USER: ${POSTGRES_USER:-aiagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiagent-local}
    ports:
      - "127.0.0.1:${AIAGENT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiagent} -d ${POSTGRES_DB:-aiagent}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  # 会话级临时附件的向量索引存储（v1.1 P1）。附件原文与索引都放 Redis（带 TTL），不落主库；
  # 关闭 RDB/AOF 持久化——临时数据靠 TTL 回收，无需落盘。
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${AIAGENT_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: api
    command: ["node", "packages/database/dist/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiagent}:${POSTGRES_PASSWORD:-aiagent-local}@postgres:5432/${POSTGRES_DB:-aiagent}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: .
      target: api
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      AIAGENT_PROVIDER_MODE: ${AIAGENT_PROVIDER_MODE:-mock}
      AIAGENT_MOCK_STEP_DELAY_MS: ${AIAGENT_MOCK_STEP_DELAY_MS:-500}
      AIAGENT_LLM_PROVIDER: ${AIAGENT_LLM_PROVIDER:-openai-compatible}
      AIAGENT_LLM_API_KEY: ${AIAGENT_LLM_API_KEY:-}
      AIAGENT_LLM_BASE_URL: ${AIAGENT_LLM_BASE_URL:-https://api.openai.com/v1}
      AIAGENT_LLM_MODEL: ${AIAGENT_LLM_MODEL:-}
      AIAGENT_LLM_TIMEOUT_MS: ${AIAGENT_LLM_TIMEOUT_MS:-30000}
      AIAGENT_LLM_API_KEY_DEEPSEEK: ${AIAGENT_LLM_API_KEY_DEEPSEEK:-}
      AIAGENT_LLM_BASE_URL_DEEPSEEK: ${AIAGENT_LLM_BASE_URL_DEEPSEEK:-}
      AIAGENT_LLM_MODEL_DEEPSEEK: ${AIAGENT_LLM_MODEL_DEEPSEEK:-}
      AIAGENT_LLM_API_KEY_OPENROUTER: ${AIAGENT_LLM_API_KEY_OPENROUTER:-}
      AIAGENT_LLM_BASE_URL_OPENROUTER: ${AIAGENT_LLM_BASE_URL_OPENROUTER:-}
      AIAGENT_LLM_MODEL_OPENROUTER: ${AIAGENT_LLM_MODEL_OPENROUTER:-}
      AIAGENT_ATTACHMENT_ORPHAN_TTL_HOURS: ${AIAGENT_ATTACHMENT_ORPHAN_TTL_HOURS:-24}
      REDIS_URL: redis://redis:6379
      AIAGENT_ATTACHMENT_TTL_SECONDS: ${AIAGENT_ATTACHMENT_TTL_SECONDS:-604800}
      AIAGENT_ATTACHMENT_INLINE_MAX_CHARS: ${AIAGENT_ATTACHMENT_INLINE_MAX_CHARS:-200000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiagent}:${POSTGRES_PASSWORD:-aiagent-local}@postgres:5432/${POSTGRES_DB:-aiagent}
      IDENTITY_FINGERPRINT_PEPPER: ${IDENTITY_FINGERPRINT_PEPPER:-change-me-in-production}
      IDENTITY_SESSION_TTL_DAYS: ${IDENTITY_SESSION_TTL_DAYS:-30}
      IDENTITY_COOKIE_SECURE: ${IDENTITY_COOKIE_SECURE:-false}
      QQBOT_ENABLED: ${QQBOT_ENABLED:-false}
      QQBOT_APP_ID: ${QQBOT_APP_ID:-}
      QQBOT_APP_SECRET: ${QQBOT_APP_SECRET:-}
      QQBOT_PUBLIC_QR_URL: ${QQBOT_PUBLIC_QR_URL:-}
      ARTIFACT_STORAGE_ROOT: /var/lib/aiagent/artifacts
    volumes:
      - artifact_data:/var/lib/aiagent/artifacts
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${AIAGENT_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped
volumes:
  artifact_data:
  postgres_data:
